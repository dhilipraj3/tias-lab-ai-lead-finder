name = "tias-lab-ai-lead-finder"
main = ".open-next/worker.js"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "tias-lead-finder-db"
database_id = "b7786fb4-7338-4478-8d01-de5f1906f90b"
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
APP_ENV = "production"
ENABLE_DEV_PREVIEW_BANNER = "false"
